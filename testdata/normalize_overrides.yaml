# Deliberate differences between the Go normalizer and Python's normalize_text.
# A corpus input listed here must normalize to `expected`; `python` is what
# normalize_golden.json records (its output, or the error it raised). Every
# entry is reviewed once at the end of the project (issue 19), which sets
# `approved: true` or removes the entry and reverts the Go behavior.

- input: "There were 3, maybe 4."
  python: "There were three maybe four."
  expected: "There were three, maybe four."
  reason: "Python's number pattern takes the commas after a number, so the pause after it is lost. The commas stay."
  approved: false
