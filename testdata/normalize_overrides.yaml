  expected: "Only one kilometer left."
  reason: "Python leaves units after a number as written (\"three GB\"). Units are spelled out, ported from TextPreprocessor's expand_units, singular after 1."
  approved: true
- input: "Smith et al. 2024, pp. 31-35"
  python: "Smith et al twenty twenty-four pages thirty-one to thirty-five"
  expected: "Smith et al twenty twenty-four, pages thirty-one to thirty-five"
  reason: "Python's number pattern takes the commas after a number, so the pause after it is lost. The commas stay."
  approved: true
