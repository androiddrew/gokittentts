  python: "See w w w d o t e x a m p l e dot o r g for details."
  expected: "See w w w dot e x a m p l e dot o r g for details."
  reason: "Python spells its own \"www dot\" as \"w w w d o t\". It is \"w w w dot\"."
  approved: true
- input: "The repo is at https://github.com/KittenML/KittenTTS."
  python: "The repo is at g i t h u b dot c o m slash k i t t e n m l slash k i t t e n t t s dot"
  expected: "The repo is at g i t h u b dot c o m slash k i t t e n m l slash k i t t e n t t s."
  reason: "Python spells the punctuation ending a URL (\"... c o m dot\"), so the sentence or clause loses its ending. It stays in the text; closing brackets and quotes there are dropped."
  approved: true
